# -----------------------------------------------------------------------------
# GENERAL
# -----------------------------------------------------------------------------
backend = "glx";
vsync = true;
detect-transient = true;
detect-client-leader = true;
xrender-sync-fence = true;

# -----------------------------------------------------------------------------
# SHADOWS
# -----------------------------------------------------------------------------
shadow = false; # better off for telegram right-clicks

# -----------------------------------------------------------------------------
# FADING
# -----------------------------------------------------------------------------
fading = true;
fade-in-step = 0.01;
fade-out-step = 0.01;
fade-delta = 2;

# -----------------------------------------------------------------------------
# BACKGROUND BLURRING
# -----------------------------------------------------------------------------
blur-method = "dual_kawase";
blur-strength = 10;

# -----------------------------------------------------------------------------
# TRANSPARENCY / OPACITY
# (per-window opacity now lives in "rules" below)
# -----------------------------------------------------------------------------
frame-opacity = 1;

# -----------------------------------------------------------------------------
# CORNERS
# This combines well with xfce-border-rounded theme of xfwm!
# -----------------------------------------------------------------------------
corner-radius = 7;

# -----------------------------------------------------------------------------
# WINDOW RULES
# NOTE: when "rules" is present, picom IGNORES the old per-window options
# (wintypes, opacity-rule, blur-background-exclude, ...), so everything
# that used to live there has been moved in here.
# Rules are applied top to bottom; later matches override earlier ones.
# -----------------------------------------------------------------------------
rules = (
  # Menus (was: wintypes)
  { match = "window_type = 'popup_menu' || window_type = 'dropdown_menu'";
    opacity = 0.99; },

  # No blur (was: blur-background-exclude)
  # use: xprop | grep WM_CLASS   to get the class name
  { match = "class_g = 'TelegramDesktop' || class_g = 'zen' || "
            "class_g = 'Meld' || class_g = 'firefox-esr' || "
            "class_g = 'org.gnome.FileRoller' || class_g = 'Gtkwave' || "
            "class_g = 'Xfce4-screenshooter' || "
            "window_type = 'popup_menu' || window_type = 'dropdown_menu' || "
            "window_type = 'menu'";
    blur-background = false; },

  # 90% opacity (was: opacity-rule)
  { match = "class_g = 'mate-calc' || class_g = 'Nemo' || "
            "class_g = 'Xfce4-settings-manager' || class_g = 'Xfce4-terminal' || "
            "class_g = 'Xfce4-screenshooter' || class_g = 'Blueman-manager' || "
            "class_g = 'kitty'";
    opacity = 0.9; },

  # skippy-xd: its own animation is off (animationDuration = 0 in the skippy
  # profiles) because it resizes every preview window per step, which is
  # very slow under picom. picom does a GPU fade instead.
  # A rule's "animations" replaces the global ones for the triggers it lists.
  # All skippy windows (overlay, previews, labels): short fade, no blur, no
  # rounded corners, no geometry animation.
  { match = "class_g = 'skippy-xd' || class_i = 'skippy-xd' || name = 'skippy-xd'";
    corner-radius = 0;
    blur-background = false;
    animations = (
      { triggers = ["open", "show"];
        opacity = {
          curve = "cubic-bezier(0,0,0.58,1)";
          duration = 0.08;
          start = 0;
          end = "window-raw-opacity";
        };
      },
      { triggers = ["close", "hide"];
        opacity = {
          curve = "cubic-bezier(0,0,0.58,1)";
          duration = 0.08;
          start = "window-raw-opacity-before";
          end = 0;
        };
      },
      { triggers = ["geometry"];
        opacity = {
          curve = "cubic-bezier(0,0,0.58,1)";
          duration = 0.001;
          start = "window-raw-opacity";
          end = "window-raw-opacity";
        };
      }
    );
  },

  # skippy-xd labels (window titles under the previews): frosted-glass pill.
  # skippy draws them translucent ([label] opacity = 150 in the profiles),
  # picom rounds them and blurs the wallpaper behind them.
  { match = "class_g = 'skippy-xd' && name = 'skippy-xd label'";
    corner-radius = 6;
    blur-background = true;
  },

  # rofi launcher (Super+Space, Super+Shift+S): frosted glass like the skippy
  # labels. config.rasi draws a translucent pywal background, picom blurs the
  # desktop behind it. corner-radius = the window border-radius in config.rasi,
  # otherwise the blur shows past the rounded corners. The newsboat quality
  # picker ("rofi - Choose:") has its own opaque theme and is left alone.
  { match = "class_g = 'Rofi' && name != 'rofi - Choose:'";
    corner-radius = 14;
    blur-background = true;
  },

  # skippy-xd previews only: fade plus a slight zoom-in from the centre.
  # (The full-screen overlay is not scaled, its edges would show.)
  { match = "class_g = 'skippy-xd' && name ^= 'skippy-xd preview window'";
    animations = (
      { triggers = ["open", "show"];
        opacity = {
          curve = "cubic-bezier(0,0,0.58,1)";
          duration = 0.08;
          start = 0;
          end = "window-raw-opacity";
        };
        scale-x = {
          curve = "cubic-bezier(0,0,0.58,1)";
          duration = 0.1;
          start = 0.97;
          end = 1;
        };
        scale-y = "scale-x";
        offset-x = "(1 - scale-x) / 2 * window-width";
        offset-y = "(1 - scale-y) / 2 * window-height";
      },
      # cross-fade when the hover (focus) moves between previews
      { triggers = ["increase-opacity", "decrease-opacity"];
        opacity = {
          curve = "cubic-bezier(0,0,0.58,1)";
          duration = 0.12;
          start = "window-raw-opacity-before";
          end = "window-raw-opacity";
        };
      }
    );
  },

  # skippy-xd hover "spotlight": skippy focuses the preview under the mouse,
  # so every preview that is not focused is dimmed. skippy's own white
  # hover tint is off ([highlight] tintOpacity = 0 in the skippy profiles).
  # Left alone, matched by size because skippy copies them at their real size
  # (picom cannot see which window a preview belongs to):
  #   desktop copies   monitor-sized, at the top edge
  #   xfce4 panel      48 px or thinner (vertical or horizontal panel)
  #   eww notes        260x784, the eww window size (update if it changes)
  { match = "class_g = 'skippy-xd' && name ^= 'skippy-xd preview window' && "
            "!focused && "
            "!(y = 0 && height >= 1080) && "
            "!(width <= 48 || height <= 48) && "
            "!(width = 260 && height = 784)";
    opacity = 0.8;
  },

  # eww sticky notes: transparent ARGB window, no blur or rounded corners
  { match = "name = 'Eww - notes'";
    blur-background = false;
    corner-radius = 0;
  },
);

@include "picom-animations.conf";