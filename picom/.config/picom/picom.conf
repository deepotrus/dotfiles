# -----------------------------------------------------------------------------
# GENERAL
# -----------------------------------------------------------------------------
backend = "glx";
vsync = true;
detect-transient = true;
detect-client-leader = true;
xrender-sync-fence = true;

# -----------------------------------------------------------------------------
# SHADOWS
# -----------------------------------------------------------------------------
shadow = false; # better off for telegram right-clicks

# -----------------------------------------------------------------------------
# FADING
# -----------------------------------------------------------------------------
fading = true;
fade-in-step = 0.01;
fade-out-step = 0.01;
fade-delta = 2;

# -----------------------------------------------------------------------------
# BACKGROUND BLURRING
# -----------------------------------------------------------------------------
blur-method = "dual_kawase";
blur-strength = 10;

# -----------------------------------------------------------------------------
# TRANSPARENCY / OPACITY
# (per-window opacity now lives in "rules" below)
# -----------------------------------------------------------------------------
frame-opacity = 1;

# -----------------------------------------------------------------------------
# CORNERS
# This combines well with xfce-border-rounded theme of xfwm!
# -----------------------------------------------------------------------------
corner-radius = 7;

# -----------------------------------------------------------------------------
# WINDOW RULES
# NOTE: when "rules" is present, picom IGNORES the old per-window options
# (wintypes, opacity-rule, blur-background-exclude, ...), so everything
# that used to live there has been moved in here.
# Rules are applied top to bottom; later matches override earlier ones.
# -----------------------------------------------------------------------------
rules = (
  # Menus (was: wintypes)
  { match = "window_type = 'popup_menu' || window_type = 'dropdown_menu'";
    opacity = 0.99; },

  # No blur (was: blur-background-exclude)
  # use: xprop | grep WM_CLASS   to get the class name
  { match = "class_g = 'TelegramDesktop' || class_g = 'zen' || "
            "class_g = 'Meld' || class_g = 'firefox-esr' || "
            "class_g = 'org.gnome.FileRoller' || class_g = 'Gtkwave' || "
            "class_g = 'Xfce4-screenshooter' || "
            "window_type = 'popup_menu' || window_type = 'dropdown_menu' || "
            "window_type = 'menu'";
    blur-background = false; },

  # 90% opacity (was: opacity-rule)
  { match = "class_g = 'mate-calc' || class_g = 'Nemo' || "
            "class_g = 'Xfce4-settings-manager' || class_g = 'Xfce4-terminal' || "
            "class_g = 'Xfce4-screenshooter' || class_g = 'Blueman-manager' || "
            "class_g = 'kitty'";
    opacity = 0.9; },

  # skippy-xd: no pop-in / pop-out, no rounded corners on the overlay.
  # A rule's "animations" replaces the global ones for the triggers it lists,
  # so this near-instant script overrides the open/show scale animation.
  { match = "class_g = 'skippy-xd' || class_i = 'skippy-xd' || name = 'skippy-xd'";
    corner-radius = 0;
    animations = (
      { triggers = ["open", "show", "close", "hide", "geometry"];
        opacity = {
          curve = "linear";
          duration = 0.001;
          start = "window-raw-opacity";
          end = "window-raw-opacity";
        };
      }
    );
  },
);

@include "picom-animations.conf";